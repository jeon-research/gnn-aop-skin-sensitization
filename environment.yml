# Pinned conda environment that reproduces the published results.
# Build with: conda env create -f environment.yml
name: gnn-aop-skin-sensitization
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.12
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.6.1
      - rdkit==2023.09.6
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - optuna==4.7.0
      - tqdm==4.67.1
      # Torch stack — install with CUDA 12.8 wheels:
      #   pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
      #   pip install torch-geometric==2.7.0
      - torch==2.9.1
      - torch-geometric==2.7.0
